[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "localrag-engine"
version = "1.2.1"
description = "Local-first chat and RAG engine with OpenAI-compatible API"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.12,<1",
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
  "httpx>=0.27,<1",
  "chromadb>=0.5,<2",
  "pypdf>=4,<7",
  "python-docx>=1.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]
rerank = ["sentence-transformers>=3,<6"]
drive = ["google-api-python-client>=2,<3", "google-auth-httplib2>=0.2,<1", "google-auth-oauthlib>=1,<2"]

[project.scripts]
localrag = "localrag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
localrag = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
